name: Release - Binarios y Notas de Versión

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Generar binario y release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore sistema-costo-viaje/sistema-costo-viaje.slnx

      - name: Publish single-file self-contained executable
        run: dotnet publish sistema-costo-viaje/sistema-costo-viaje.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sistema-costo-viaje-exe
          path: publish/sistema-costo-viaje.exe

      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "1.${{ github.run_number }}.0"
          $tag = "v$version"

          gh release delete $tag --yes --cleanup-tag 2>$null

          gh release create $tag "publish/sistema-costo-viaje.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "Sistema Costo Viaje v$version" `
            --generate-notes `
            --latest
