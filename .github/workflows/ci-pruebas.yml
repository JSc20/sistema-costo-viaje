name: CI Pipeline - Sistema Costo Viaje

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore sistema-costo-viaje/sistema-costo-viaje.slnx

      - name: Build solution in Release mode
        run: dotnet build sistema-costo-viaje/sistema-costo-viaje.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test SistemaCostoViaje.Tests/SistemaCostoViaje.Tests.csproj --configuration Release --no-build